<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" width="880" height="560" role="img" aria-label="Animated terminal demo. soma wraps an AI agent under policy, journals every action in a hash-chained log, catches a tampered line, anchors the chain head at a public RFC 3161 timestamp authority, and a stranger verifies the evidence with openssl and no soma installed.">
  <title>soma: capability you can prove</title>
  <desc>An eight scene terminal walkthrough with subtitles, using real soma output: wrap an agent under policy, journal and verify, catch tampering at the exact line, anchor the chain head at an independent authority, and verify the evidence with stock openssl.</desc>
  <defs>
    <style>
      .term { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13.5px; }
      .cap  { font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, sans-serif; }
      .p   { fill: #3fb950; }   /* prompt */
      .cmd { fill: #e6edf3; }   /* command */
      .o   { fill: #8b949e; }   /* dim output */
      .ok  { fill: #3fb950; }   /* success */
      .no  { fill: #f85149; }   /* error / tamper */
      .h   { fill: #79c0ff; }   /* hash / link */
      .scene { opacity: 0; animation: show 24s infinite; }
      @keyframes show { 0%,1.5%{opacity:0} 4%{opacity:1} 11%{opacity:1} 13%,100%{opacity:0} }
      .bar { transform-origin: 0 0; animation: prog 24s linear infinite; }
      @keyframes prog { from { transform: scaleX(0); } to { transform: scaleX(1); } }
      .cur { fill: #3fb950; animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>

  <!-- window -->
  <rect x="0" y="0" width="880" height="560" rx="12" fill="#0d1117"/>
  <rect x="0" y="0" width="880" height="40" rx="12" fill="#161b22"/>
  <rect x="0" y="28" width="880" height="12" fill="#161b22"/>
  <circle cx="24" cy="20" r="6" fill="#f85149"/>
  <circle cx="46" cy="20" r="6" fill="#d29922"/>
  <circle cx="68" cy="20" r="6" fill="#3fb950"/>
  <text x="440" y="25" text-anchor="middle" class="cap" font-size="13" fill="#6e7681">soma  &#183;  govern any agent, prove what it did</text>

  <!-- caption band -->
  <rect x="0" y="470" width="880" height="66" fill="#11151c"/>
  <rect x="0" y="470" width="880" height="1" fill="#30363d"/>
  <rect class="bar" x="0" y="555" width="880" height="5" fill="#1f6feb"/>

  <!-- ===== Scene 0 : the problem ===== -->
  <g class="scene" style="animation-delay:0s">
    <text class="term o" x="28" y="96"># your agent just ran 40 commands across the repo.</text>
    <text class="term cmd" x="28" y="124"># can you prove what it actually did? <tspan class="cur">&#9608;</tspan></text>
    <text class="cap" x="440" y="510" text-anchor="middle" font-size="18" fill="#e6edf3">AI agents are black boxes. soma makes every run provable.</text>
  </g>

  <!-- ===== Scene 1 : wrap ===== -->
  <g class="scene" style="animation-delay:3s">
    <text class="term" x="28" y="96"><tspan class="p">$ </tspan><tspan class="cmd">soma wrap --label fix-tests -- claude -p "fix the failing tests"</tspan></text>
    <text class="term o" x="28" y="124">scanning workspace... 18 files</text>
    <text class="term o" x="28" y="148">found 2 failing tests in src/storage.rs</text>
    <text class="term o" x="28" y="172">applied fix: handle empty-key case in put()</text>
    <text class="term o" x="28" y="196">re-ran suite: 219 passed, 0 failed</text>
    <text class="term" x="28" y="224"><tspan class="ok">wrap[fix-tests]: exit 0 &#183; 289ms &#183; </tspan><tspan class="h">stdout sha256 6228b984&#8230;</tspan><tspan class="o"> journaled</tspan></text>
    <text class="cap" x="440" y="510" text-anchor="middle" font-size="18" fill="#e6edf3">Wrap any agent CLI. soma policy-checks the launch, hashes the output, writes receipts.</text>
  </g>

  <!-- ===== Scene 2 : refusal ===== -->
  <g class="scene" style="animation-delay:6s">
    <text class="term" x="28" y="96"><tspan class="p">$ </tspan><tspan class="cmd">soma wrap -- sudo whoami</tspan></text>
    <text class="term no" x="28" y="124">soma: command blocked by policy (deny_commands:sudo *)</text>
    <text class="cap" x="440" y="510" text-anchor="middle" font-size="18" fill="#e6edf3">Deny-listed commands never spawn. The refusal is journaled with the rule that fired.</text>
  </g>

  <!-- ===== Scene 3 : verify ===== -->
  <g class="scene" style="animation-delay:9s">
    <text class="term" x="28" y="96"><tspan class="p">$ </tspan><tspan class="cmd">soma log verify</tspan></text>
    <text class="term" x="28" y="124"><tspan class="ok">journal OK &#183; 11 events &#183; </tspan><tspan class="h">head 99e57180db6aeac1&#8230;</tspan></text>
    <text class="cap" x="440" y="510" text-anchor="middle" font-size="18" fill="#e6edf3">Every action is a line in an append-only, hash-chained journal.</text>
  </g>

  <!-- ===== Scene 4 : tamper ===== -->
  <g class="scene" style="animation-delay:12s">
    <text class="term" x="28" y="96"><tspan class="p">$ </tspan><tspan class="cmd">sed -i '' 's/empty-key/SILENT-BACKDOOR/' .soma/events.jsonl</tspan></text>
    <text class="term" x="28" y="124"><tspan class="p">$ </tspan><tspan class="cmd">soma log verify</tspan></text>
    <text class="term no" x="28" y="152">soma: journal TAMPERED at line 9: content hash mismatch (line edited)</text>
    <text class="cap" x="440" y="510" text-anchor="middle" font-size="18" fill="#e6edf3">Edit one word of history and verification fails, at the exact line.</text>
  </g>

  <!-- ===== Scene 5 : anchor ===== -->
  <g class="scene" style="animation-delay:15s">
    <text class="term" x="28" y="96"><tspan class="p">$ </tspan><tspan class="cmd">soma anchor now</tspan></text>
    <text class="term" x="28" y="124"><tspan class="ok">anchored journal head at seq 4 </tspan><tspan class="h">(e23c9b3ac2b4&#8230;)</tspan></text>
    <text class="term ok" x="28" y="148">  TSA: https://freetsa.org/tsr &#8594; granted</text>
    <text class="cap" x="440" y="510" text-anchor="middle" font-size="18" fill="#e6edf3">I own this machine, so the chain head is timestamped by an independent authority.</text>
  </g>

  <!-- ===== Scene 6 : stranger verifies ===== -->
  <g class="scene" style="animation-delay:18s">
    <text class="term" x="28" y="96"><tspan class="p">stranger$ </tspan><tspan class="cmd">openssl ts -verify -queryfile anchor.tsq -in anchor.tsr -CAfile cacert.pem</tspan></text>
    <text class="term ok" x="28" y="126" font-size="16">Verification: OK</text>
    <text class="cap" x="440" y="510" text-anchor="middle" font-size="18" fill="#e6edf3">A public RFC 3161 authority signed it. Anyone verifies with openssl. No soma required.</text>
  </g>

  <!-- ===== Scene 7 : close ===== -->
  <g class="scene" style="animation-delay:21s">
    <text class="term" x="28" y="96"><tspan class="p">$ </tspan><tspan class="cmd">soma export eu-ai-act</tspan><tspan class="o">    &#8594; EU AI Act Article 12 logging annex</tspan></text>
    <text class="term" x="28" y="124"><tspan class="p">$ </tspan><tspan class="cmd">soma export attestation</tspan><tspan class="o">  &#8594; in-toto Statement &#183; chain.verified: true</tspan></text>
    <text class="term" x="28" y="192" font-family="ui-sans-serif, -apple-system, sans-serif" font-size="30" font-weight="700" fill="#e6edf3">capability you can prove</text>
    <text class="term h" x="28" y="224" font-size="16">github.com/radotsvetkov/soma</text>
    <text class="cap" x="440" y="510" text-anchor="middle" font-size="18" fill="#e6edf3">Portable evidence for clients, auditors, and the EU AI Act.</text>
  </g>
</svg>

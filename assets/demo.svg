<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="img" aria-label="Terminal demo: soma wraps an AI agent, journals every action, anchors the chain, and exports verifiable evidence that fails on tamper.">
  <defs>
    <style>
      .win { fill: #0d1117; }
      .bar { fill: #161b22; }
      .edge { stroke: #30363d; stroke-width: 1; }
      text { font-size: 15px; }
      .p  { fill: #3fb950; }       /* prompt $ */
      .c  { fill: #c9d1d9; }       /* command / plain */
      .o  { fill: #8b949e; }       /* dim output */
      .ok { fill: #3fb950; }       /* success */
      .no { fill: #f85149; }       /* failure / tamper */
      .cm { fill: #6e7681; font-style: italic; } /* comment */
      .row { opacity: 0; animation: rise .45s ease-out forwards; }
      @keyframes rise { from { opacity: 0; } to { opacity: 1; } }
      .cur { fill: #3fb950; animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>

  <rect class="win" x="0" y="0" width="800" height="470" rx="10"/>
  <rect class="bar edge" x="0" y="0" width="800" height="38" rx="10"/>
  <rect class="bar" x="0" y="28" width="800" height="12"/>
  <circle cx="22" cy="19" r="6" fill="#f85149"/>
  <circle cx="44" cy="19" r="6" fill="#d29922"/>
  <circle cx="66" cy="19" r="6" fill="#3fb950"/>
  <text x="400" y="24" text-anchor="middle" class="o" font-size="13">soma  —  govern any agent, prove what it did</text>

  <g transform="translate(24,72)">
    <g class="row" style="animation-delay:.2s">
      <text class="p" x="0" y="0">$ <tspan class="c">soma wrap --label fix-tests -- claude -p "fix the failing tests"</tspan></text>
    </g>
    <g class="row" style="animation-delay:1.0s">
      <text class="o" x="0" y="30">wrap[fix-tests]: exit 0 in 2.4s · stdout 14KB sha256 5891b5b5…</text>
    </g>

    <g class="row" style="animation-delay:1.9s">
      <text class="p" x="0" y="66">$ <tspan class="c">soma log verify</tspan></text>
    </g>
    <g class="row" style="animation-delay:2.6s">
      <text class="ok" x="0" y="96">journal OK · 42 events · chain intact</text>
    </g>

    <g class="row" style="animation-delay:3.4s">
      <text class="p" x="0" y="132">$ <tspan class="c">soma anchor now</tspan></text>
    </g>
    <g class="row" style="animation-delay:4.1s">
      <text class="ok" x="0" y="162">anchored · granted by freetsa.org · RFC 3161 timestamp on the chain head</text>
    </g>

    <g class="row" style="animation-delay:4.9s">
      <text class="p" x="0" y="198">$ <tspan class="c">soma export</tspan></text>
    </g>
    <g class="row" style="animation-delay:5.6s">
      <text class="o" x="0" y="228">bundle written · verify with shasum and openssl, no soma required</text>
    </g>

    <g class="row" style="animation-delay:6.6s">
      <text class="cm" x="0" y="266"># a reviewer edits one line of the journal, then checks again:</text>
    </g>
    <g class="row" style="animation-delay:7.4s">
      <text class="no" x="0" y="296">soma log verify  →  TAMPER at line 14 · chain broken</text>
    </g>
    <g class="row" style="animation-delay:8.3s">
      <text class="ok" x="0" y="326">restore  →  journal OK · chain intact</text>
    </g>

    <g class="row" style="animation-delay:9.2s">
      <text class="p" x="0" y="362">$ <tspan class="cur">█</tspan></text>
    </g>
  </g>
</svg>

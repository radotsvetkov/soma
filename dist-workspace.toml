[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.31.0"
# CI backends to support
ci = "github"
# The installers to generate for each app.
# A single "shell" installer (curl | sh) is offered for convenience, but the
# README leads with the verify-the-binary-yourself path, which is the on-brand
# trust story for an evidence tool. Homebrew is intentionally NOT wired into
# dist: the tap (radotsvetkov/homebrew-soma) is maintained MANUALLY (see
# RELEASING.md) so no cross-repo PAT ever touches CI and every release stays
# green. To enable automatic Homebrew publishing later: add "homebrew" here, set
# tap = "radotsvetkov/homebrew-soma" and publish-jobs = ["homebrew"], add a
# fine-grained HOMEBREW_TAP_TOKEN secret (contents:write on the tap), and run
# `dist generate`.
installers = ["shell"]
# Target platforms to build apps for (Rust target-triple syntax).
# macOS and Linux only, matching the platform support soma actually claims and
# tests. soma is std-only so it cross-compiles cleanly; Windows is omitted
# because anchor/verify lean on system curl and OpenSSL 3.x, which the docs
# describe in unix terms and which is where soma is exercised.
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
]
